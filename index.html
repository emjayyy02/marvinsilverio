<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marvin Silverio — Automation Engineer & Frontend Developer building reliable workflow automations and web interfaces." />
    <script>
      (function () {
        var savedTheme = null
        try { savedTheme = localStorage.getItem('marvin-theme') } catch (error) {}
        var validTheme = savedTheme === 'light' || savedTheme === 'dark'
        var theme = savedTheme === 'light-gray'
          ? 'light'
          : (validTheme ? savedTheme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))
        document.documentElement.classList.remove('dark', 'light-gray')
        if (theme === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
      })()
    </script>
    <title>Marvin Silverio — Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
