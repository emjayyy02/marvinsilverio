<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title description">
  <title id="title">A controlled incident lifecycle</title>
  <desc id="description">Failure becomes a persistent incident, followed by evidence, AI diagnosis, validation and policy. Policy can escalate, require human approval, or allow guarded retry. Approval still passes safety gates. Only an allowed retry reaches verification. Outcomes and events are persisted; pending is not recovered.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#525252"/></marker></defs>
  <rect width="720" height="1320" rx="8" fill="#fafafa"/>
  <g fill="none" stroke="#525252" stroke-width="3" marker-end="url(#arrow)">
    <path d="M360 104v30M360 214v30M360 324v30M360 434v30"/>
    <path d="M250 544H140v48M470 544h110v48M360 544v270"/>
    <path d="M580 724v40H470v50"/>
    <path d="M360 894v30M360 1004v30M360 1114v54"/>
    <path d="M140 724v484h76" stroke-dasharray="8 7"/>
  </g>
  <g fill="#fff" stroke="#a3a3a3" stroke-width="2">
    <rect x="130" y="24" width="460" height="80" rx="8"/>
    <rect x="70" y="134" width="580" height="80" rx="8"/>
    <rect x="130" y="244" width="460" height="80" rx="8"/>
    <rect x="130" y="354" width="460" height="80" rx="8"/>
    <rect x="70" y="464" width="580" height="80" rx="8"/>
    <rect x="30" y="592" width="220" height="132" rx="8"/>
    <rect x="470" y="592" width="220" height="132" rx="8"/>
    <rect x="200" y="814" width="420" height="80" rx="8"/>
    <rect x="200" y="924" width="420" height="80" rx="8"/>
    <rect x="200" y="1034" width="420" height="80" rx="8"/>
    <rect x="216" y="1168" width="474" height="122" rx="8"/>
  </g>
  <g fill="#171717" font-family="Arial, sans-serif" font-size="44" text-anchor="middle">
    <text x="360" y="80">Failed execution</text>
    <text x="360" y="190">Persistent incident</text>
    <text x="360" y="300">Evidence</text>
    <text x="360" y="410">AI diagnosis</text>
    <text x="360" y="520">Validation + policy</text>
    <text x="140" y="650" font-size="40">Escalate</text>
    <text x="140" y="697" font-size="40">Stop retry</text>
    <text x="580" y="650" font-size="40">Human</text>
    <text x="580" y="697" font-size="40">approval</text>
    <text x="410" y="870">Safety gates</text>
    <text x="410" y="980">Guarded retry</text>
    <text x="410" y="1090">Verification</text>
    <text x="453" y="1221" font-size="40">Persist outcome</text>
    <text x="453" y="1271" font-size="40">+ audit history</text>
  </g>
</svg>
