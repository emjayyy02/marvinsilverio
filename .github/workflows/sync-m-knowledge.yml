name: Sync M Portfolio Knowledge

on:
  push:
    branches:
      - main
    paths:
      - "src/data/**"
      - "scripts/generate-portfolio-knowledge.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  sync-knowledge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          path: portfolio

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci

      - name: Generate portfolio knowledge
        working-directory: portfolio
        run: npm run generate:portfolio-knowledge

      - name: Checkout M Worker
        uses: actions/checkout@v4
        with:
          repository: emjayyy02/m-porftfolio-assistant
          token: ${{ secrets.M_WORKER_REPO_TOKEN }}
          path: worker

      - name: Copy generated knowledge
        run: |
          cp portfolio/portfolio-generated.md worker/docs/portfolio-generated.md

      - name: Commit updated knowledge
        working-directory: worker
        run: |
          git config user.name "portfolio-knowledge-bot"
          git config user.email "actions@github.com"

          git add docs/portfolio-generated.md

          if git diff --cached --quiet; then
            echo "Portfolio knowledge is already up to date."
            exit 0
          fi

          git commit -m "sync portfolio assistant knowledge"
          git push
